name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: signalboard
          POSTGRES_PASSWORD: signalboard
          POSTGRES_DB: signalboard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U signalboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://signalboard:signalboard@localhost:5432/signalboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm test

  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: grafana/setup-k6-action@v1
      - run: npm ci
      - name: Start server and seed
        run: |
          export ADMIN_KEY=ci-admin POSTER_KEY=ci-poster VIEWER_KEY=ci-viewer
          node src/server.js &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:3000/healthz && break; sleep 0.5; done
          CHANNEL_ID=$(curl -sf -X POST http://127.0.0.1:3000/api/channels \
            -H "Authorization: Bearer ci-admin" -H "Content-Type: application/json" \
            -d '{"name":"load"}' | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "CHANNEL_ID=$CHANNEL_ID" >> "$GITHUB_ENV"
      - name: Run k6 smoke
        run: k6 run load/k6-smoke.js
        env:
          VIEWER_KEY: ci-viewer
          POSTER_KEY: ci-poster
